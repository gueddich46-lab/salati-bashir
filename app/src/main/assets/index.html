let state;try{state=JSON.parse(localStorage.getItem('salati-v3'))||{}}catch{state={}}state={city:'تونس',lang:'ar',times:defaults,enabled:[true,false,true,true,true,true],...state};const $=id=>document.getElementById(id);const save=()=>localStorage.setItem('salati-v3',JSON.stringify(state));function text(){let t=tr[state.lang];document.documentElement.lang=state.lang;document.documentElement.dir=state.lang==='ar'?'rtl':'ltr';$('subtitle').textContent=t.subtitle;$('nextLabel').textContent=t.next;$('remainingLabel').textContent=t.remaining;$('timesTitle').textContent=t.times;$('demoLabel').textContent=t.demo;$('qiblaText').textContent=t.qibla;$('adhanText').textContent=t.adhan;$('editText').textContent=t.edit;$('footerNote').textContent=t.footer;$('homeNav').textContent='⌂ '+t.home;$('timesNav').textContent='◷ '+t.times;$('settingsNav').textContent='⚙ '+t.settings;$('cityLabel').textContent=state.city;renderRows()}function renderRows(){let today=new Date(),mins=today.getHours()*60+today.getMinutes(),idx=state.times.findIndex((s,i)=>i!==1&&parseTime(s)>mins);if(idx<0)idx=0;$('prayerRows').innerHTML=state.times.map((tm,i)=>`<div class="prayer ${idx===i?'active':''}"><span class="symbol">${icons[i]}</span><span class="pname">${names[state.lang][i]}</span><span class="ptime">${tm}</span><button class="sound" data-index="${i}" aria-label="Toggle">${state.enabled[i]?'♬':'♩'}</button></div>`).join('');document.querySelectorAll('.sound').forEach(b=>b.onclick=()=>{let i=+b.dataset.index;state.enabled[i]=!state.enabled[i];save();renderRows()})}function parseTime(s){let a=s.split(':').map(Number);return a[0]*60+a[1]}function tick(){let d=new Date();$('clock').textContent=d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});$('date').innerHTML=d.toLocaleDateString(state.lang==='ar'?'ar-TN':state.lang==='fr'?'fr-FR':'en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'})+'<br>'+new Intl.DateTimeFormat('ar-TN-u-ca-islamic',{day:'numeric',month:'long',year:'numeric'}).format(d);let now=d.getHours()*3600+d.getMinutes()*60+d.getSeconds(),idx=state.times.findIndex((s,i)=>i!==1&&parseTime(s)*60>now);let future=idx<0;idx=future?0:idx;let target=parseTime(state.times[idx])*60+(future?86400:0),diff=Math.max(0,target-now);$('nextName').textContent=names[state.lang][idx];$('countdown').textContent=[Math.floor(diff/3600),Math.floor(diff%3600/60),diff%60].map(x=>String(x).padStart(2,'0')).join(':');if(d.getSeconds()===0)renderRows()}function openSheet(type){let t=tr[state.lang];$('overlay').classList.add('show');$('sheetTitle').textContent=type==='settings'?t.settings:type==='times'?t.edit:type==='city'?t.city:type==='qibla'?t.qibla:t.adhan;$('cancelBtn').textContent=t.cancel;$('saveBtn').textContent=t.save;$('sheetNote').textContent=t.note;$('saveBtn').style.display='';if(type==='settings'){$('sheetBody').innerHTML=`<label>${t.city}</label><input id="cityInput" value="${escapeHtml(state.city)}" maxlength="55"><label>${t.language}</label><select id="langInput"><option value="ar">العربية</option><option value="fr">Français</option><option value="en">English</option></select>`;$('langInput').value=state.lang}else if(type==='times'){$('sheetBody').innerHTML=state.times.map((v,i)=>`<label>${names[state.lang][i]}</label><input type="time" id="tm${i}" value="${v}">`).join('')}else if(type==='city'){$('sheetBody').innerHTML=`<label>${t.city}</label><input id="cityInput" value="${escapeHtml(state.city)}" maxlength="55">`}else{$('sheetBody').textContent=t.unavailable;$('saveBtn').style.display='none'}$('saveBtn').onclick=()=>{if(type==='settings'){state.city=$('cityInput').value.trim()||state.city;state.lang=$('langInput').value}else if(type==='city'){state.city=$('cityInput').value.trim()||state.city}else if(type==='times'){state.times=state.times.map((v,i)=>$('tm'+i).value||v)}save();closeSheet();text();tick()}}function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function  $('saveBtn').onclick=()=>{const name=$('tnCitySelect').value;if(name){state.city=name;const p=tunisianCenters[name];state.coords={lat:p[0],lon:p[1],manual:true};state.method='tunisia';state.country='TN';save();closeSheet();updateFromCoords();text();gpsMessage('تم تحديث المواقيت لإحداثيات '+name+'. قارنها بالتقويم الرسمي.')}else old()};
 }
};
const splash=$('splash');$('enterApp').onclick=()=>{splash.classList.add('hide');if(window.AndroidLocation&&window.AndroidLocation.requestLocation){gpsMessage('جارٍ تحديث الموقع والمواقيت تلقائيًا...');window.AndroidLocation.requestLocation()}};
function gpsMessage(msg){$('gpsStatus').textContent=msg}
// GPS native Android + offline astronomical estimates. Check against local authority.
const placeAR={'Gafsa':'قفصة','Tunis':'تونس','Sfax':'صفاقس','Sousse':'سوسة','Ariana':'أريانة','Sukrah':'سكرة','La Soukra':'سكرة','Kairouan':'القيروان','Gabes':'قابس','Kasserine':'القصرين','Tozeur':'توزر','Kebili':'قبلي','Monastir':'المنستير','Mahdia':'المهدية','Nabeul':'نابل','Bizerte':'بنزرت','Beja':'باجة','Jendouba':'جندوبة','Siliana':'سليانة','Zaghouan':'زغوان','Sidi Bouzid':'سيدي بوزيد','Ben Arous':'بن عروس','Manouba':'منوبة','Tataouine':'تطاوين','Paris':'باريس','London':'لندن'};
function dayNumber(d){return Math.floor((new Date(d.getFullYear(),d.getMonth(),d.getDate())-new Date(d.getFullYear(),0,1))/86400000)+1}
function calcPrayer(lat,lon,date){
 const r=Math.PI/180,n=dayNumber(date),g=2*Math.PI/365*(n-1);
 const eq=229.18*(0.000075+0.001868*Math.cos(g)-0.032077*Math.sin(g)-0.014615*Math.cos(2*g)-0.040849*Math.sin(2*g));
 const dec=0.006918-0.399912*Math.cos(g)+0.070257*Math.sin(g)-0.006758*Math.cos(2*g)+0.000907*Math.sin(2*g)-0.002697*Math.cos(3*g)+0.00148*Math.sin(3*g);
 const method=state.method||'tunisia';const presets={tunisia:[18,18],mwl:[18,17],egypt:[19.5,17.5],karachi:[18,18],isna:[15,15],ummalqura:[18,18.5],custom:[Number(state.fajrAngle||18),Number(state.ishaAngle||18)]};const angles=presets[method]||presets.tunisia;const ha=alt=>{let v=(Math.sin(alt*r)-Math.sin(lat*r)*Math.sin(dec))/(Math.cos(lat*r)*Math.cos(dec));return Math.abs(v)>1?null:Math.acos(v)/r};
 const tz=(state.country==='TN'?60:-date.getTimezoneOffset()),mid=720-4*lon-eq+tz,hSun=ha(-.833),hFajr=ha(-angles[0]),hIsha=ha(-angles[1]);
 const asrAlt=Math.atan(1/((state.asrSchool==='hanafi'?2:1)+Math.tan(Math.abs(lat*r-dec))))/r,hAsr=ha(asrAlt);
 if([hSun,hFajr,hIsha,hAsr].some(x=>x===null))return null;
 const m=[mid-4*hFajr,mid-4*hSun,mid,mid+4*hAsr,mid+4*hSun,mid+4*hIsha];
 return m.map(v=>{let x=((Math.round(v)%1440)+1440)%1440;return String(Math.floor(x/60)).padStart(2,'0')+':'+String(x%60).padStart(2,'0')});
}
function updateFromCoords(){if(!state.coords)return;let {lat,lon}=state.coords;
 let p=calcPrayer(Number(lat),Number(lon),new Date());if(!p){gpsMessage('تعذر حساب المواقيت لهذه الإحداثيات.');return}
 state.times=p.map((v,i)=>{const shift=Number((state.offsets||[])[i]||0);const a=v.split(':').map(Number);const total=((a[0]*60+a[1]+shift)%1440+1440)%1440;return String(Math.floor(total/60)).padStart(2,'0')+':'+String(total%60).padStart(2,'0')});save();text();tick();$('demoLabel').textContent='حساب فلكي تقريبي';$('footerNote').textContent='تحقق من مواقيت الجهة الدينية المحلية. الأذان التلقائي غير مفعل.';
}
window.salatiNativeLocation=(lat,lon,accuracy,city,country)=>{state.coords={lat,lon,accuracy};if(city)state.city=placeAR[city]||city;state.coords.manual=false;if(country){state.country=country;const automatic={TN:'tunisia',EG:'egypt',SA:'ummalqura',PK:'karachi',IN:'karachi',US:'isna',CA:'isna',FR:'mwl',DE:'mwl',GB:'mwl'};if(state.autoMethod!==false&&automatic[country])state.method=automatic[country];}save();updateFromCoords();$('cityLabel').textContent=state.city;gpsMessage('تم تحديد الموقع: '+state.city+' — تم تحديث المواقيت حسابيًا. طابقها مع التقويم المحلي.');};
window.salatiNativeError=msg=>gpsMessage(msg);
$('gpsBtn').onclick=()=>{gpsMessage('جارٍ تحديد الموقع...');if(window.AndroidLocation&&window.AndroidLocation.requestLocation){window.AndroidLocation.requestLocation();return}
 if(!navigator.geolocation){gpsMessage('الموقع غير متاح. افتح التطبيق عبر HTTPS أو APK.');return}
 navigator.geolocation.getCurrentPosition(p=>window.salatiNativeLocation(p.coords.latitude,p.coords.longitude,p.coords.accuracy,''),e=>gpsMessage('تعذر تحديد الموقع: '+e.message),{enableHighAccuracy:true,timeout:30000});};
if(state.coords){updateFromCoords();gpsMessage('تم استرجاع الموقع المحفوظ. اضغط GPS لتحديثه.')}
text();tick();setInterval(tick,1000);let previousDay=new Date().toDateString();setInterval(()=>{let day=new Date().toDateString();if(day!==previousDay){previousDay=day;updateFromCoords()}},60000);
</script></body></html>
